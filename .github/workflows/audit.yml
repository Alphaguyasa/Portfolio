name: Weekly audit

# CI audits only when a PR or a push runs, so an advisory published against the
# deployed build between changes would go unseen until the next PR. This job
# re-runs the same production audit and registry signature check on main once a
# week. Install scripts are skipped: nothing is built here, and it keeps the run to
# about a minute.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: production audit (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # Same check as CI: a re-published or tampered tarball fails here too, even
      # in a week with no PRs.
      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
