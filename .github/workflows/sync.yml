name: Sync GitHub data

# Once a day: read the public repos (read-only), regenerate the project copy,
# verify the facts, and commit the snapshot if anything changed. Uses the
# workflow's own GITHUB_TOKEN, so no personal token is needed. A commit pushed
# with GITHUB_TOKEN does not start other workflows; Vercel still deploys it.
on:
  schedule:
    - cron: "17 3 * * *" # 06:17 in Addis Ababa
  workflow_dispatch:

concurrency:
  group: sync-github
  cancel-in-progress: false

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync

      - name: Commit the new snapshot
        run: |
          if git diff --quiet -- data PORTFOLIO_COPY.md && [ -z "$(git ls-files --others --exclude-standard -- data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "Alphaguyasa"
          git config user.email "alphaguyasa@users.noreply.github.com"
          git add data PORTFOLIO_COPY.md
          git commit -m "Update project data from GitHub"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
